<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide-react@0.469.0/dist/umd/lucide-react.min.js"></script>

    <style>
      :root {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --primary: 180 100% 50%; /* Cyan Neon */
        --primary-foreground: 222.2 47.4% 11.2%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --destructive: 0 62.8% 30.6%;
      }

      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glass-strong {
        background: rgba(13, 17, 23, 0.8);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .neon-border {
        border: 1px solid hsl(var(--primary));
        box-shadow: 0 0 5px hsl(var(--primary) / 0.5);
      }

      .neon-text {
        color: hsl(var(--primary));
        text-shadow: 0 0 5px hsl(var(--primary) / 0.5);
      }

      .neon-glow {
        box-shadow: 0 0 15px hsl(var(--primary) / 0.5);
      }

      .gradient-primary {
        background: linear-gradient(135deg, hsl(var(--primary)), #0099ff);
      }

      .scan-line {
        position: relative;
      }
      .scan-line::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background:
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
          );
        z-index: 2;
        background-size:
          100% 2px,
          3px 100%;
        pointer-events: none;
      }

      /* Toast Styles */
      .toast-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        padding: 12px 20px;
        border-radius: 8px;
        background: #1a1a1a;
        border: 1px solid #333;
        color: white;
        animation: slideIn 0.3s ease-out;
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 200px;
        font-size: 14px;
      }
      .toast.success {
        border-color: #10b981;
        color: #10b981;
      }
      .toast.error {
        border-color: #ef4444;
        color: #ef4444;
      }

      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: "hsl(var(--primary))",
              "primary-foreground": "hsl(var(--primary-foreground))",
              muted: "hsl(var(--muted))",
              "muted-foreground": "hsl(var(--muted-foreground))",
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              destructive: "hsl(var(--destructive))",
            },
            fontFamily: {
              display: ['"Orbitron"', "sans-serif"],
              body: ['"Inter"', "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { createClient } = supabase;

      // Componente de Icono seguro para evitar errores si la librería falla
      const Icon = ({ name, ...props }) => {
        const Icons = window.lucide || window.lucideReact || {};
        const Component = Icons[name];
        if (!Component) {
          return (
            <span className="text-xs font-mono text-muted-foreground">
              [{name}]
            </span>
          );
        }
        return <Component {...props} />;
      };

      // --- CONFIGURACIÓN SUPABASE ---
      // REEMPLAZA ESTO CON TUS DATOS REALES
      const SUPABASE_URL = "https://cwrltqviszanzdmgpriu.supabase.co"; // <--- PON TU URL AQUÍ
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3cmx0cXZpc3phbnpkbWdwcml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzNjk3NjEsImV4cCI6MjA4Nzk0NTc2MX0.yKFsFQ3UFpeoPSkObf_OyWivyzgB7XrPhcsa4VbShFE"; // <--- PON TU KEY AQUÍ

      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // --- TOAST SYSTEM (Reemplazo de Sonner) ---
      const ToastContext = React.createContext();
      const ToastProvider = ({ children }) => {
        const [toasts, setToasts] = useState([]);
        const addToast = (message, type = "default") => {
          const id = Date.now();
          setToasts((prev) => [...prev, { id, message, type }]);
          setTimeout(
            () => setToasts((prev) => prev.filter((t) => t.id !== id)),
            3000,
          );
        };
        return (
          <ToastContext.Provider value={{ addToast }}>
            {children}
            <div className="toast-container">
              {toasts.map((t) => (
                <div key={t.id} className={`toast ${t.type}`}>
                  {t.message}
                </div>
              ))}
            </div>
          </ToastContext.Provider>
        );
      };
      const useToast = () => React.useContext(ToastContext);

      // --- ADMIN COMPONENT ---
      const Admin = () => {
        const WHATSAPP_NUMBER = "584247423318"; // <--- PON TU NUMERO DE WHATSAPP AQUI (con código de país)
        const { addToast } = useToast();
        const toast = {
          success: (msg) => addToast(msg, "success"),
          error: (msg) => addToast(msg, "error"),
        };

        const [authenticated, setAuthenticated] = useState(false);
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [loading, setLoading] = useState(false);
        const [products, setProducts] = useState([]);
        const [cart, setCart] = useState([]);
        const [showForm, setShowForm] = useState(false);
        const [showCart, setShowCart] = useState(false);
        const [isCheckingOut, setIsCheckingOut] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const [form, setForm] = useState({
          name: "",
          description: "",
          price: "",
          category: "",
        });
        const [imageFile, setImageFile] = useState(null);
        const [imagePreview, setImagePreview] = useState(null);
        const fileInputRef = useRef(null);

        useEffect(() => {
          // Intenta obtener la sesión al cargar para verificar la conexión
          supabaseClient.auth.getSession().then(({ data: { session }, error }) => {
            if (error) {
              console.error("Error de conexión inicial con Supabase:", error);
              toast.error("Error de conexión con Supabase.");
            } else {
              console.log("Conexión con Supabase exitosa. Sesión:", session);
              setAuthenticated(!!session);
            }
          });

          fetchProducts(); // Cargar productos siempre (público)

          const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
            setAuthenticated(!!session);
          });
          return () => {
            authListener.subscription.unsubscribe();
          };
        }, []);

        // Limpieza de memoria para previsualización de imágenes
        useEffect(() => {
          return () => {
            if (imagePreview && imagePreview.startsWith("blob:"))
              URL.revokeObjectURL(imagePreview);
          };
        }, [imagePreview]);

        const fetchProducts = async () => {
          const { data } = await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", { ascending: false });
          if (data) setProducts(data);
        };

        const handleLogin = async (e) => {
          e.preventDefault();
          setLoading(true);

          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            // Si falla el login, intentamos crear el usuario automáticamente
            if (
              error.message.includes("Invalid login") ||
              error.message.includes("credentials")
            ) {
              const { data: signUpData, error: signUpError } =
                await supabaseClient.auth.signUp({
                  email,
                  password,
                });

              if (signUpError) {
                if (
                  signUpError.message.includes("not allowed") ||
                  signUpError.message.includes("disabled")
                ) {
                  toast.error("⚠️ Error: El registro está desactivado.");
                  setTimeout(
                    () =>
                      toast.error(
                        "Ve a Supabase > Auth > Providers > Email y activa 'Enable Email Signup'",
                      ),
                    1500,
                  );
                } else {
                  toast.error("Error creando usuario: " + signUpError.message);
                }
              } else if (signUpData.session) {
                toast.success("¡Acceso concedido! (Usuario creado)");
              } else {
                toast.success(
                  "Usuario creado. Si no entras, desactiva 'Confirm Email' en Supabase.",
                );
              }
            } else if (error.message.includes("Email not confirmed")) {
              toast.error(
                "⚠️ Email no confirmado. Ve a Supabase y desactiva 'Confirm Email'.",
              );
            } else if (error.message.includes("disabled")) {
              toast.error(
                "⚠️ Error: Activa 'Enable Email Signup' en Supabase.",
              );
            } else {
              toast.error("Error de conexión: " + error.message);
            }
          }
          setLoading(false);
        };

        const handleLogout = async () => {
          await supabaseClient.auth.signOut();
          setAuthenticated(false);
        };

        const handleImageSelect = (e) => {
          const file = e.target.files?.[0];
          if (file) {
            setImageFile(file);
            setImagePreview(URL.createObjectURL(file));
          }
        };

        const uploadImage = async (file) => {
          const ext = file.name.split(".").pop() || "jpg";
          const path = `${Date.now()}.${ext}`;
          const { error } = await supabaseClient.storage
            .from("product-images")
            .upload(path, file);
          if (error) {
            console.error("Error subiendo imagen:", error);
            toast.error("Error subiendo imagen: " + error.message);
            return null;
          }
          const {
            data: { publicUrl },
          } = supabaseClient.storage.from("product-images").getPublicUrl(path);
          return publicUrl;
        };

        const handleSave = async (e) => {
          e.preventDefault();
          if (!form.name || !form.price) {
            toast.error("Nombre y precio obligatorios");
            return;
          }
          setLoading(true);
          let image_url = null;
          if (imageFile) {
            image_url = await uploadImage(imageFile);
            if (!image_url) {
              setLoading(false);
              return;
            }
          }

          const productData = {
            name: form.name,
            description: form.description || null,
            price: parseFloat(form.price) || 0,
            category: form.category || null,
            ...(image_url ? { image_url } : {}),
          };

          if (editingId) {
            const { error } = await supabaseClient
              .from("products")
              .update(productData)
              .eq("id", editingId);
            if (error) toast.error("Error actualizando");
            else toast.success("Producto actualizado");
          } else {
            const { error } = await supabaseClient
              .from("products")
              .insert([{ ...productData, available: true }]);
            if (error) toast.error("Error creando");
            else toast.success("Producto creado");
          }
          resetForm();
          fetchProducts();
          setLoading(false);
        };

        const handleEdit = (p) => {
          setForm({
            name: p.name,
            description: p.description || "",
            price: p.price.toString(),
            category: p.category || "",
          });
          setImagePreview(p.image_url);
          setEditingId(p.id);
          setShowForm(true);
        };

        const handleDelete = async (id) => {
          if (!confirm("¿Eliminar?")) return;
          await supabaseClient.from("products").delete().eq("id", id);
          toast.success("Eliminado");
          fetchProducts();
        };

        const handleToggle = async (id, available) => {
          await supabaseClient
            .from("products")
            .update({ available: !available })
            .eq("id", id);
          fetchProducts();
        };

        const resetForm = () => {
          setForm({ name: "", description: "", price: "", category: "" });
          setImageFile(null);
          setImagePreview(null);
          setEditingId(null);
          setShowForm(false);
        };

        // --- LÓGICA DEL CARRITO ---
        const addToCart = (product) => {
          setCart([...cart, product]);
          toast.success("Agregado al carrito");
        };

        const removeFromCart = (indexToRemove) => {
          setCart(cart.filter((_, index) => index !== indexToRemove));
        };

        const cartTotal = cart.reduce((sum, item) => sum + item.price, 0);

        const handleCheckout = () => {
          if (cart.length === 0) return;
          setIsCheckingOut(true);

          const finalizeCheckout = (locationUrl = "") => {
            let message = "Hola! Quiero realizar el siguiente pedido:\n\n";
            cart.forEach((item) => {
              message += `- ${item.name} ($${item.price})\n`;
            });
            message += `\nTotal: $${cartTotal}`;

            if (locationUrl) {
              message += `\n\n📍 Ubicación GPS:\n${locationUrl}`;
            }

            // Usamos encodeURIComponent para evitar errores de caracteres y location.href para evitar bloqueo de popups en móvil
            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.location.href = url;

            setIsCheckingOut(false);
            setShowCart(false);
          };

          if ("geolocation" in navigator) {
            toast.success("Obteniendo ubicación GPS...");
            navigator.geolocation.getCurrentPosition(
              (position) => {
                const { latitude, longitude } = position.coords;
                const mapsUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
                finalizeCheckout(mapsUrl);
              },
              (error) => {
                toast.error("No se pudo obtener ubicación. Enviando sin GPS.");
                finalizeCheckout();
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          } else {
            finalizeCheckout();
          }
        };

        // Formateador de moneda
        const formatPrice = (price) => {
          return new Intl.NumberFormat("es-CO", {
            style: "currency",
            currency: "COP",
          }).format(price);
        };

        return (
          <div className="min-h-screen bg-background scan-line">
            {!authenticated ? (
              <section className="py-12 px-4 border-b border-border/50 relative overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-b from-primary/5 via-transparent to-transparent pointer-events-none" />
                <div className="container mx-auto max-w-sm relative z-10">
                  <form
                    onSubmit={handleLogin}
                    className="glass neon-border rounded-2xl p-8 w-full space-y-6"
                  >
                    <div className="text-center">
                      <div className="glass rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4 neon-glow">
                        <Icon name="Lock" className="h-8 w-8 text-primary" />
                      </div>
                      <h1 className="font-display text-xl font-bold neon-text tracking-wider">
                        maria mendoza
                      </h1>
                      <p className="text-muted-foreground text-sm mt-1">
                        Ingresa tus credenciales
                      </p>
                    </div>
                    <input
                      type="email"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="Correo electrónico"
                      className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body"
                      required
                    />
                    <input
                      type="password"
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="Contraseña"
                      className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body"
                      required
                      minLength={6}
                    />
                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full gradient-primary text-primary-foreground font-display font-bold py-3 rounded-lg tracking-wider transition-all hover:scale-[1.02] disabled:opacity-50 text-sm"
                    >
                      {loading ? "VERIFICANDO..." : "ACCEDER"}
                    </button>
                  </form>
                </div>
              </section>
            ) : (
              <header className="glass-strong sticky top-0 z-50 border-b border-border">
                <div className="container mx-auto flex items-center justify-between py-3 px-4">
                  <h1 className="font-display text-lg font-bold neon-text tracking-wider">
                    PANEL ADMIN
                  </h1>
                  <div className="flex gap-2">
                    <button
                      onClick={() => {
                        resetForm();
                        setShowForm(true);
                      }}
                      className="gradient-primary text-primary-foreground rounded-lg px-3 py-2 text-sm font-semibold flex items-center gap-1.5"
                    >
                      <Icon name="Plus" className="h-4 w-4" /> Nuevo
                    </button>
                    <button
                      onClick={handleLogout}
                      className="glass neon-border rounded-lg p-2 hover:neon-glow transition-all"
                    >
                      <Icon name="LogOut" className="h-4 w-4 text-primary" />
                    </button>
                  </div>
                </div>
              </header>
            )}

            <main className="container mx-auto px-4 py-6">
              {/* --- MODAL DEL CARRITO --- */}
              {showCart && (
                <div className="fixed inset-0 z-[60] flex items-center justify-center px-4">
                  <div
                    className="absolute inset-0 bg-background/80 backdrop-blur-sm"
                    onClick={() => setShowCart(false)}
                  />
                  <div className="relative glass-strong neon-border rounded-2xl p-6 w-full max-w-md max-h-[80vh] flex flex-col">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="font-display text-xl font-bold neon-text">
                        TU CARRITO
                      </h2>
                      <button
                        onClick={() => setShowCart(false)}
                        className="text-muted-foreground hover:text-foreground"
                      >
                        <Icon name="X" className="h-6 w-6" />
                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-3 mb-4">
                      {cart.length === 0 ? (
                        <p className="text-center text-muted-foreground py-8">
                          El carrito está vacío
                        </p>
                      ) : (
                        cart.map((item, index) => (
                          <div
                            key={index}
                            className="glass rounded-lg p-3 flex justify-between items-center"
                          >
                            <div className="flex items-center gap-3">
                              <div className="w-12 h-12 rounded bg-muted overflow-hidden">
                                {item.image_url && (
                                  <img
                                    src={item.image_url}
                                    className="w-full h-full object-cover"
                                  />
                                )}
                              </div>
                              <div>
                                <p className="font-bold text-sm">{item.name}</p>
                                <p className="text-xs text-primary">
                                  ${item.price}
                                </p>
                              </div>
                            </div>
                            <button
                              onClick={() => removeFromCart(index)}
                              className="text-destructive hover:bg-destructive/10 p-1 rounded"
                            >
                              <Icon name="Trash2" className="h-4 w-4" />
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="border-t border-border pt-4 space-y-4">
                      <div className="flex justify-between items-center font-display font-bold text-lg">
                        <span>Total:</span>
                        <span className="neon-text">${cartTotal}</span>
                      </div>
                      <button
                        onClick={handleCheckout}
                        disabled={cart.length === 0 || isCheckingOut}
                        className="w-full gradient-primary text-primary-foreground font-display font-bold py-3 rounded-lg tracking-wider disabled:opacity-50 hover:scale-[1.02] transition-transform"
                      >
                        {isCheckingOut ? "OBTENIENDO UBICACIÓN..." : "COMPRAR POR WHATSAPP"}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showForm && (
                <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                  <div
                    className="absolute inset-0 bg-background/60 backdrop-blur-sm"
                    onClick={resetForm}
                  />
                  <form
                    onSubmit={handleSave}
                    className="relative glass-strong neon-border rounded-2xl p-6 w-full max-w-md space-y-4 max-h-[90vh] overflow-y-auto"
                  >
                    <div className="flex justify-between items-center">
                      <h2 className="font-display text-sm font-bold tracking-wider neon-text">
                        {editingId ? "EDITAR" : "NUEVO"} PRODUCTO
                      </h2>
                      <button
                        type="button"
                        onClick={resetForm}
                        className="text-muted-foreground hover:text-foreground"
                      >
                        <Icon name="X" className="h-5 w-5" />
                      </button>
                    </div>

                    <div
                      onClick={() => fileInputRef.current?.click()}
                      className="border-2 border-dashed border-border rounded-xl p-6 text-center cursor-pointer hover:border-primary/40 transition-colors"
                    >
                      {imagePreview ? (
                        <img
                          src={imagePreview}
                          alt="Preview"
                          className="w-full h-40 object-cover rounded-lg"
                        />
                      ) : (
                        <div className="space-y-2">
                          <Icon
                            name="Upload"
                            className="h-8 w-8 text-muted-foreground mx-auto"
                          />
                          <p className="text-muted-foreground text-sm">
                            Toca para subir foto
                          </p>
                        </div>
                      )}
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="image/*"
                        onChange={handleImageSelect}
                        className="hidden"
                      />
                    </div>

                    <input
                      value={form.name}
                      onChange={(e) =>
                        setForm({ ...form, name: e.target.value })
                      }
                      placeholder="Nombre del producto"
                      className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body"
                      required
                    />
                    <textarea
                      value={form.description}
                      onChange={(e) =>
                        setForm({ ...form, description: e.target.value })
                      }
                      placeholder="Descripción"
                      rows={3}
                      className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body resize-none"
                    />
                    <div className="grid grid-cols-2 gap-3">
                      <input
                        value={form.price}
                        onChange={(e) =>
                          setForm({ ...form, price: e.target.value })
                        }
                        placeholder="Precio"
                        type="number"
                        step="0.01"
                        className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body"
                        required
                      />
                      <input
                        value={form.category}
                        onChange={(e) =>
                          setForm({ ...form, category: e.target.value })
                        }
                        placeholder="Categoría"
                        className="w-full bg-input border border-border rounded-lg px-4 py-3 text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 font-body"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={loading}
                      className="w-full gradient-primary text-primary-foreground font-display font-bold py-3 rounded-lg tracking-wider flex items-center justify-center gap-2 text-sm disabled:opacity-50"
                    >
                      <Icon name="Save" className="h-4 w-4" />
                      {loading ? "GUARDANDO..." : "GUARDAR"}
                    </button>
                  </form>
                </div>
              )}

              {/* --- GRID DE PRODUCTOS --- */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
                {products.length === 0 ? (
                  <div className="text-center py-20 col-span-full">
                    <p className="text-muted-foreground font-body text-lg">
                      No hay productos. Crea el primero.
                    </p>
                  </div>
                ) : (
                  products.map((p) => (
                    <div
                      key={p.id}
                      className="glass neon-border rounded-2xl overflow-hidden flex flex-col group hover:neon-glow transition-all duration-300"
                    >
                      {/* Imagen Grande */}
                      <div className="relative w-full h-64 bg-muted overflow-hidden">
                        {p.image_url ? (
                          <img
                            src={p.image_url}
                            alt={p.name}
                            className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                          />
                        ) : (
                          <div className="w-full h-full flex items-center justify-center text-muted-foreground text-xs font-display">
                            SIN IMAGEN
                          </div>
                        )}

                        {/* Badge de estado (solo admin) */}
                        {authenticated && (
                          <div className="absolute top-2 right-2 flex gap-1">
                            <span
                              className={`px-2 py-1 rounded text-xs font-bold glass-strong ${p.available ? "text-green-400" : "text-destructive"}`}
                            >
                              {p.available ? "ACTIVO" : "INACTIVO"}
                            </span>
                          </div>
                        )}
                      </div>

                      {/* Info del Producto */}
                      <div className="p-5 flex flex-col flex-1">
                        <h3 className="font-display text-lg font-bold truncate mb-1">
                          {p.name}
                        </h3>
                        <p className="text-muted-foreground text-sm line-clamp-2 mb-4 flex-1">
                          {p.description}
                        </p>

                        <div className="flex items-center justify-between mt-auto">
                          <p className="neon-text font-display text-xl font-bold">
                            ${p.price}
                          </p>
                          <button
                            onClick={() => addToCart(p)}
                            className="bg-primary/10 hover:bg-primary/20 text-primary border border-primary/50 rounded-full p-2 transition-colors"
                          >
                            <Icon name="ShoppingCart" className="h-5 w-5" />
                          </button>
                        </div>
                      </div>

                      {/* Controles de Admin */}
                      {authenticated && (
                        <div className="flex gap-2 p-3 border-t border-white/10 bg-black/20 justify-end">
                          <button
                            onClick={() => handleToggle(p.id, p.available)}
                            className="text-muted-foreground hover:text-foreground p-1"
                            title="Alternar disponibilidad"
                          >
                            <Icon
                              name={p.available ? "Eye" : "EyeOff"}
                              className="h-4 w-4"
                            />
                          </button>
                          <button
                            onClick={() => handleEdit(p)}
                            className="text-primary hover:text-primary/80 p-1"
                          >
                            <Icon name="Edit2" className="h-4 w-4" />
                          </button>
                          <button
                            onClick={() => handleDelete(p.id)}
                            className="text-destructive hover:text-destructive/80 p-1"
                          >
                            <Icon name="Trash2" className="h-4 w-4" />
                          </button>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>

              {/* --- BOTÓN FLOTANTE DEL CARRITO --- */}
              <button
                onClick={() => setShowCart(true)}
                className="fixed bottom-6 right-6 z-40 gradient-primary text-primary-foreground w-16 h-16 rounded-full shadow-lg flex items-center justify-center hover:scale-110 transition-transform neon-glow"
              >
                <div className="relative">
                  <Icon name="ShoppingCart" className="h-8 w-8" />
                  {cart.length > 0 && (
                    <span className="absolute -top-2 -right-2 bg-destructive text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border border-background">
                      {cart.length}
                    </span>
                  )}
                </div>
              </button>
            </main>
          </div>
        );
      };

      const App = () => (
        <ToastProvider>
          <Admin />
        </ToastProvider>
      );

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
